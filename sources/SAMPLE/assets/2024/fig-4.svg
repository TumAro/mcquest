<svg viewBox="-50 -50 300 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Axes -->
  <line x1="0" y1="250" x2="250" y2="250" stroke="black" stroke-width="2"/>
  <line x1="0" y1="0" x2="0" y2="250" stroke="black" stroke-width="2"/>
  <!-- Axis labels -->
  <text x="245" y="270" font-size="14" font-family="serif">x</text>
  <text x="-20" y="15" font-size="14" font-family="serif">y</text>
  <!-- V shape: y = |x| -->
  <polyline points="0,250 125,0 250,250" stroke="black" stroke-width="2" fill="none"/>
</svg>
